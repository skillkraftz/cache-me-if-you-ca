services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "18080:5000"
      - "18443:5443"
    environment:
      APP_ENV: dev
      REQUEST_TIMEOUT: "3"
      REDIS_URL: redis://redis:6379/0
      PUBLIC_PORT: "5000"
      OPERATOR_PORT: "5443"
      TOKEN_SERVICE_URL: http://token-service:5003
      INTERNAL_ADMIN_A_URL: http://internal-admin-a:5001
      INTERNAL_ADMIN_B_URL: http://internal-admin-b:5001
      ALLOWED_PROXY_URLS: http://internal-admin-a:5001/health,http://internal-admin-b:5001/health
      GATEWAY_CLIENT_ID: gateway
      GATEWAY_CLIENT_PRIVATE_KEY_PEM: *gateway_private
      GATEWAY_TLS_SERVER_CERT_PEM: *gateway_mtls_server_cert
      GATEWAY_TLS_SERVER_KEY_PEM: *gateway_mtls_server_key
      GATEWAY_TLS_CLIENT_CA_CERT_PEM: *operator_mtls_ca_cert
      ACCESS_TOKEN_PUBLIC_KEY_PEM: *token_public
      INTERNAL_ADMIN_A_RESPONSE_PUBLIC_KEY_PEM: *admin_a_response_public
      INTERNAL_ADMIN_B_RESPONSE_PUBLIC_KEY_PEM: *admin_b_response_public
      TOKEN_AUDIENCE: internal-admin
      SERVICE_ASSERTION_AUDIENCE: token-service
      OPERATOR_ASSERTION_AUDIENCE: mesh-operator-approval
      RESPONSE_PROOF_AUDIENCE: gateway
      OPERATOR_PUBLIC_KEY_PEM: *operator_public
      ALLOWED_OPERATOR_IDS: ops-admin
    depends_on:
      - token-service
      - internal-admin-a
      - internal-admin-b
      - redirector
      - redis
    networks:
      - ring

  internal-admin-a:
    build:
      context: .
      dockerfile: internal-admin/Dockerfile
    environment:
      APP_ENV: dev
      REPLICA_NAME: internal-admin-a
      REPLICA_TARGET: a
      ACCESS_TOKEN_PUBLIC_KEY_PEM: *token_public
      RESPONSE_SIGNING_PRIVATE_KEY_PEM: *admin_a_response_private
      RESPONSE_PROOF_AUDIENCE: gateway
      OPERATOR_PUBLIC_KEY_PEM: *operator_public
      JTI_CACHE_TTL_SECONDS: "120"
      TOKEN_AUDIENCE: internal-admin
      REDIS_URL: redis://redis:6379/0
      OPERATOR_ASSERTION_AUDIENCE: mesh-operator-approval
      ALLOWED_OPERATOR_IDS: ops-admin
    expose:
      - "5001"
    networks:
      - ring

  internal-admin-b:
    build:
      context: .
      dockerfile: internal-admin/Dockerfile
    environment:
      APP_ENV: dev
      REPLICA_NAME: internal-admin-b
      REPLICA_TARGET: b
      ACCESS_TOKEN_PUBLIC_KEY_PEM: *token_public
      RESPONSE_SIGNING_PRIVATE_KEY_PEM: *admin_b_response_private
      RESPONSE_PROOF_AUDIENCE: gateway
      OPERATOR_PUBLIC_KEY_PEM: *operator_public
      JTI_CACHE_TTL_SECONDS: "120"
      TOKEN_AUDIENCE: internal-admin
      REDIS_URL: redis://redis:6379/0
      OPERATOR_ASSERTION_AUDIENCE: mesh-operator-approval
      ALLOWED_OPERATOR_IDS: ops-admin
    expose:
      - "5001"
    networks:
      - ring

  token-service:
    build:
      context: .
      dockerfile: token-service/Dockerfile
    environment:
      APP_ENV: dev
      REDIS_URL: redis://redis:6379/0
      TOKEN_AUDIENCE: internal-admin
      ACCESS_TOKEN_PRIVATE_KEY_PEM: *token_private
      RATE_LIMIT_PER_MINUTE: "120"
      RATE_LIMIT_BURST: "60"
      EXPORT_TARGETS: a,b
      GATEWAY_CLIENT_PUBLIC_KEY_PEM: *gateway_public
      OBSERVER_CLIENT_PUBLIC_KEY_PEM: *observer_public
      OPERATOR_PUBLIC_KEY_PEM: *operator_public
      SERVICE_ASSERTION_AUDIENCE: token-service
      OPERATOR_ASSERTION_AUDIENCE: mesh-operator-approval
      ALLOWED_OPERATOR_IDS: ops-admin
    expose:
      - "5003"
    depends_on:
      - redis
    networks:
      - ring

  tester:
    build:
      context: .
      dockerfile: tester/Dockerfile
    environment:
      GATEWAY_CLIENT_PRIVATE_KEY_PEM: *gateway_private
      OBSERVER_CLIENT_PRIVATE_KEY_PEM: *observer_private
      OPERATOR_PRIVATE_KEY_PEM: *operator_private
      GATEWAY_TLS_CA_CERT_PEM: *operator_mtls_ca_cert
      OPERATOR_CLIENT_CERT_PEM: *operator_client_cert
      OPERATOR_CLIENT_KEY_PEM: *operator_client_key
      INTERNAL_ADMIN_A_RESPONSE_PUBLIC_KEY_PEM: *admin_a_response_public
      INTERNAL_ADMIN_B_RESPONSE_PUBLIC_KEY_PEM: *admin_b_response_public
      SERVICE_ASSERTION_AUDIENCE: token-service
      OPERATOR_ASSERTION_AUDIENCE: mesh-operator-approval
      RESPONSE_PROOF_AUDIENCE: gateway
    depends_on:
      - gateway
      - token-service
      - internal-admin-a
      - internal-admin-b
    networks:
      - ring

  redirector:
    build: ./redirector
    expose:
      - "5002"
    networks:
      - ring

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - ring

networks:
  ring:
    driver: bridge
